<!doctype html>
<html lang="ms" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --red: #ffba00;
        --ink: #ffffff;
        --shade: #091936;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: var(--shade);
      }
      #root { position: relative; width: 100%; height: 100%; }
      /* Portrait footage filled across 16:9: each shot is 1920x3413 and its top offset frames the hair. */
      .shot {
        position: absolute; left: 0; top: 0; width: 1920px; height: 3413px;
        object-fit: cover; z-index: 1;
      }
      .layer { z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40.3" data-width="1920" data-height="1080">

      <!-- ===== FOOTAGE (lane 0) ===== -->
      <video id="v-hook" class="clip shot" style="top: -840px" src="assets/video/final.mp4" playsinline data-has-audio="true"
        data-start="0" data-duration="2.9" data-media-start="9.3" data-volume="0.12" data-track-index="0"></video>
      <video id="v-cut" class="clip shot" style="top: -880px" src="assets/video/cut.mp4" playsinline data-has-audio="true"
        data-start="2.9" data-duration="6.8" data-media-start="0" data-volume="0.2" data-fade-in="0.15" data-track-index="0"></video>
      <video id="v-wash" class="clip shot" style="top: -980px" src="assets/video/wash.mp4" playsinline data-has-audio="true"
        data-start="9.7" data-duration="5.2" data-media-start="3.5" data-volume="0.2" data-track-index="0"></video>
      <video id="v-final" class="clip shot" style="top: -820px" src="assets/video/final.mp4" playsinline data-has-audio="true"
        data-start="14.9" data-duration="8" data-media-start="4" data-volume="0.1" data-track-index="0"></video>
      <video id="v-back" class="clip shot" style="top: -720px" src="assets/video/final.mp4" playsinline data-has-audio="true"
        data-start="22.9" data-duration="3" data-media-start="17.5" data-volume="0.1" data-fade-out="0.3" data-track-index="0"></video>

      <!-- ===== GRAPHICS (lane 1) ===== -->
      <div id="hook" class="layer" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="step1" class="layer" data-composition-id="step1" data-composition-src="compositions/step1.html"
        data-start="2.9" data-duration="6.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="step2" class="layer" data-composition-id="step2" data-composition-src="compositions/step2.html"
        data-start="9.7" data-duration="5.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reveal" class="layer" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="14.9" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="compare" class="layer" data-composition-id="compare" data-composition-src="compositions/compare.html"
        data-start="25.9" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="cta" class="layer" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="31.9" data-duration="6.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="elas-outro" data-composition-id="elas-outro" data-composition-src="compositions/elas-outro-16x9.html"
        data-start="36.1" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 20"></div>

      <!-- ===== SFX (lane 2, lane 3 where they overlap) — peaks land ~1 frame after the picture ===== -->
      <audio id="sfx-hook-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0.0" data-duration="2.1" data-volume="0.55" data-track-index="2"></audio>
      <audio id="sfx-hook-pop" class="clip" src="assets/sfx/pop.mp3" data-start="1.0" data-duration="0.7" data-volume="1.6" data-track-index="3"></audio>
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.77" data-duration="0.57" data-volume="1" data-track-index="2"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="3.05" data-duration="0.7" data-volume="1.6" data-track-index="3"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="9.03" data-duration="2.2" data-media-start="1.8" data-volume="0.55" data-fade-out="0.6" data-track-index="2"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop.mp3" data-start="9.85" data-duration="0.7" data-volume="1.6" data-track-index="3"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="12.46" data-duration="2.5" data-media-start="1.0" data-volume="0.4" data-fade-in="0.8" data-track-index="2"></audio>
      <audio id="sfx-reveal-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="14.9" data-duration="2.1" data-volume="0.6" data-track-index="3"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="15.92" data-duration="1.8" data-volume="0.5" data-track-index="2"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="22.77" data-duration="0.57" data-volume="1" data-track-index="2"></audio>
      <audio id="sfx-whoosh-4" class="clip" src="assets/sfx/whoosh.mp3" data-start="25.77" data-duration="0.57" data-volume="0.9" data-track-index="2"></audio>
      <audio id="sfx-wipe-1" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="26.43" data-duration="1.2" data-media-start="1.8" data-volume="0.45" data-fade-out="0.4" data-track-index="3"></audio>
      <audio id="sfx-wipe-2" class="clip" src="assets/sfx/whoosh.mp3" data-start="28.43" data-duration="0.57" data-volume="0.9" data-track-index="2"></audio>
      <audio id="sfx-wipe-3" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="30.43" data-duration="1.2" data-media-start="1.8" data-volume="0.45" data-fade-out="0.4" data-track-index="3"></audio>
      <audio id="sfx-cta-impact" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="31.9" data-duration="0.69" data-media-start="1.9" data-volume="0.45" data-track-index="2"></audio>
      <audio id="sfx-cta-pop" class="clip" src="assets/sfx/pop.mp3" data-start="32.81" data-duration="0.7" data-volume="1.6" data-track-index="3"></audio>
      <audio id="sfx-cta-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="33.4" data-duration="1.8" data-volume="0.45" data-track-index="2"></audio>

      <!-- ===== MUSIC BED (brand/music/elas-lofi-90.mp3, looped): under voice + ambience, then up for the outro ===== -->
      <audio id="music-bed" class="clip" src="assets/music/elas-lofi-90-60s.mp3" data-start="0" data-duration="36.1" data-volume="0.22" data-fade-in="0.3" data-track-index="9"></audio>
      <audio id="music-outro" class="clip" src="assets/music/elas-lofi-90-60s.mp3" data-start="36.1" data-duration="4.2" data-media-start="36.1" data-volume="0.55" data-fade-out="1.4" data-track-index="9"></audio>

      <!-- ===== VOICE OVER (lane 4) — ElevenLabs Brian, script in ../SCRIPT.md ===== -->
      <audio id="vo-1" class="clip" src="assets/vo/vo1.wav" data-start="0.2" data-duration="1.93" data-volume="1" data-track-index="4"></audio>
      <audio id="vo-2" class="clip" src="assets/vo/vo2.wav" data-start="3.2" data-duration="4.93" data-volume="1" data-track-index="4"></audio>
      <audio id="vo-3" class="clip" src="assets/vo/vo3.wav" data-start="9.9" data-duration="4.61" data-volume="1" data-track-index="4"></audio>
      <audio id="vo-4" class="clip" src="assets/vo/vo4.wav" data-start="15.5" data-duration="5.42" data-volume="1" data-track-index="4"></audio>
      <audio id="vo-5" class="clip" src="assets/vo/vo5.wav" data-start="23.2" data-duration="2.05" data-volume="1" data-track-index="4"></audio>
      <audio id="vo-6" class="clip" src="assets/vo/vo6.wav" data-start="26.3" data-duration="3.09" data-volume="1" data-track-index="4"></audio>
      <audio id="vo-7" class="clip" src="assets/vo/vo7.wav" data-start="33.33" data-duration="4.24" data-volume="1" data-track-index="4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Slow tilt down each shot (y) plus a punch-in; transform origin sits on the visible frame centre.
      const shots = [
        ["#v-hook", 0, 2.9, [-840, -940], 1.18, 1.05, "sine.out"],
        ["#v-cut", 2.9, 6.8, [-880, -1000], 1.1, 1.0, "sine.out"],
        ["#v-wash", 9.7, 5.2, [-980, -1060], 1.0, 1.08, "sine.inOut"],
        ["#v-back", 22.9, 3, [-720, -1040], 1.0, 1.0, "sine.out"],
      ];
      shots.forEach(([id, t, d, [a, b], s0, s1, ease]) => {
        tl.fromTo(id, { y: 0, scale: s0, transformOrigin: `50% ${-a + 540}px` },
          { y: b - a, scale: s1, duration: d, ease }, t);
      });
      tl.fromTo("#v-final", { scale: 1.3, transformOrigin: "50% 1360px" }, { scale: 1.0, duration: 0.5, ease: "power4.out" }, 14.9);
      tl.fromTo("#v-final", { y: 0 }, { y: -180, duration: 8, ease: "sine.inOut" }, 14.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
