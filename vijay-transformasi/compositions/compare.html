      tl.fromTo("#cmp-tw", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none", immediateRender: i === 1 }, t0 + 0.75);
      tl.fromTo("#cmp-ts", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2.2)", immediateRender: i === 1 }, t0 + 0.9);

        tl.set("#cmp-tw", { opacity: 1 }, t0 + 2);
        tl.set("#cmp-ts", { opacity: 0 }, t0 + 2);
