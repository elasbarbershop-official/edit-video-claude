<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --red: #e1251b;
        --ink: #ffffff;
        --shade: #0b0b0b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: var(--shade);
      }
      #root { position: relative; width: 100%; height: 100%; }
      .shot {
        position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
        object-fit: cover; z-index: 1;
      }
      .layer { z-index: 10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="33" data-width="1080" data-height="1920">

      <!-- ===== FOOTAGE (lane 0) ===== -->
      <video id="v-hook" class="clip shot" src="assets/video/final.mp4" playsinline data-has-audio="true"
        data-start="0" data-duration="2.4" data-media-start="9.3" data-volume="0.12" data-track-index="0"></video>
      <video id="v-cut" class="clip shot" src="assets/video/cut.mp4" playsinline data-has-audio="true"
        data-start="2.4" data-duration="5" data-media-start="0" data-volume="0.45" data-fade-in="0.15" data-track-index="0"></video>
      <video id="v-wash" class="clip shot" src="assets/video/wash.mp4" playsinline data-has-audio="true"
        data-start="7.4" data-duration="5" data-media-start="3.5" data-volume="0.45" data-track-index="0"></video>
      <video id="v-final" class="clip shot" src="assets/video/final.mp4" playsinline data-has-audio="true"
        data-start="12.4" data-duration="8" data-media-start="4" data-volume="0.1" data-track-index="0"></video>
      <video id="v-back" class="clip shot" src="assets/video/final.mp4" playsinline data-has-audio="true"
        data-start="20.4" data-duration="3" data-media-start="17.5" data-volume="0.1" data-fade-out="0.3" data-track-index="0"></video>

      <!-- ===== GRAPHICS (lane 1) ===== -->
      <div id="hook" class="layer" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="step1" class="layer" data-composition-id="step1" data-composition-src="compositions/step1.html"
        data-start="2.4" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="step2" class="layer" data-composition-id="step2" data-composition-src="compositions/step2.html"
        data-start="7.4" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="reveal" class="layer" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="12.4" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="compare" class="layer" data-composition-id="compare" data-composition-src="compositions/compare.html"
        data-start="23.4" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" class="layer" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="29.4" data-duration="3.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- ===== SFX (lane 2, lane 3 where they overlap) — peaks land ~1 frame after the picture ===== -->
      <audio id="sfx-hook-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="2.1" data-volume="0.55" data-track-index="2"></audio>
      <audio id="sfx-hook-pop" class="clip" src="assets/sfx/pop.mp3" data-start="1.0" data-duration="0.7" data-volume="1.6" data-track-index="3"></audio>
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.27" data-duration="0.57" data-volume="1" data-track-index="2"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="2.55" data-duration="0.7" data-volume="1.6" data-track-index="3"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="6.73" data-duration="2.2" data-media-start="1.8" data-volume="0.55" data-fade-out="0.6" data-track-index="2"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop.mp3" data-start="7.55" data-duration="0.7" data-volume="1.6" data-track-index="3"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="9.96" data-duration="2.5" data-media-start="1.0" data-volume="0.4" data-fade-in="0.8" data-track-index="2"></audio>
      <audio id="sfx-reveal-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="12.4" data-duration="2.1" data-volume="0.6" data-track-index="3"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="13.42" data-duration="1.8" data-volume="0.5" data-track-index="2"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="20.27" data-duration="0.57" data-volume="1" data-track-index="2"></audio>
      <audio id="sfx-whoosh-4" class="clip" src="assets/sfx/whoosh.mp3" data-start="23.27" data-duration="0.57" data-volume="0.9" data-track-index="2"></audio>
      <audio id="sfx-wipe-1" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="23.93" data-duration="1.2" data-media-start="1.8" data-volume="0.45" data-fade-out="0.4" data-track-index="3"></audio>
      <audio id="sfx-wipe-2" class="clip" src="assets/sfx/whoosh.mp3" data-start="25.93" data-duration="0.57" data-volume="0.9" data-track-index="2"></audio>
      <audio id="sfx-wipe-3" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="27.93" data-duration="1.2" data-media-start="1.8" data-volume="0.45" data-fade-out="0.4" data-track-index="3"></audio>
      <audio id="sfx-cta-impact" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="29.4" data-duration="0.69" data-media-start="1.9" data-volume="0.45" data-track-index="2"></audio>
      <audio id="sfx-cta-pop" class="clip" src="assets/sfx/pop.mp3" data-start="30.31" data-duration="0.7" data-volume="1.6" data-track-index="3"></audio>
      <audio id="sfx-cta-sparkle" class="clip" src="assets/sfx/sparkle.mp3" data-start="30.9" data-duration="1.8" data-volume="0.45" data-track-index="2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Punch-ins on the footage: one slow push per shot.
      tl.fromTo("#v-hook", { scale: 1.25 }, { scale: 1.08, duration: 2.4, ease: "sine.out" }, 0);
      tl.fromTo("#v-cut", { scale: 1.12 }, { scale: 1.0, duration: 5, ease: "sine.out" }, 2.4);
      tl.fromTo("#v-wash", { scale: 1.0 }, { scale: 1.1, duration: 5, ease: "sine.inOut" }, 7.4);
      tl.fromTo("#v-final", { scale: 1.3 }, { scale: 1.0, duration: 0.5, ease: "power4.out" }, 12.4);
      tl.fromTo("#v-final", { scale: 1.0 }, { scale: 1.08, duration: 7.5, ease: "sine.inOut", immediateRender: false }, 12.9);
      tl.fromTo("#v-back", { scale: 1.12 }, { scale: 1.0, duration: 3, ease: "sine.out" }, 20.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
