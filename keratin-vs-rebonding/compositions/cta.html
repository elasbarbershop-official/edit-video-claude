    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#ct-q", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 0.15);

    tl.set("#ct-ph", { opacity: 0 }, 2.26);
    const word = "KERATIN", typed = document.querySelector("#ct-typed");
    const st = { n: 0 };

      onUpdate: () => { typed.textContent = word.slice(0, Math.floor(st.n + 0.0001)); } }, 2.28);
    tl.set(typed, { textContent: "" }, 0);
    tl.to("#ct-send", { backgroundColor: "#ffba00", duration: 0.1, ease: "none" }, 2.55);

    // Logo build, L0 = 4.5 ("Elas Barbershop").
    // E, L, S rise from behind the baseline.

      tl.fromTo(id, { y: 230 }, { y: 0, duration: 0.45, ease: "power4.out" }, 4.5 + i * 0.07));
    // The razor swings open on its hinge and snaps into the A.
    tl.fromTo("#lg-razor", { rotation: -210, scale: 0.5, opacity: 0, transformOrigin: "55.9% 37%" },
